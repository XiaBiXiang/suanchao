[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 默认值会在 alembic/env.py 中被 settings.DATABASE_URL 覆盖
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/suanchao

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
